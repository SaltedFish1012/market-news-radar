services:
  radar:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8000" # Do not expose public internet unauthenticated.
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./lb_tokens:/home/appuser/.longbridge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
