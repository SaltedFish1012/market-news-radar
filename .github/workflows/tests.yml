name: Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: ./data/radar.db
      CONFIG_DIR: ./config
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pytest
          npm install --prefix "$RUNNER_TEMP/radar-dom-tests" jsdom@29.1.1 --no-save --ignore-scripts
      - name: Backend tests
        run: .venv/bin/python -m pytest -q
      - name: Frontend DOM tests
        env:
          NODE_PATH: ${{ runner.temp }}/radar-dom-tests/node_modules
        run: node --test tests/frontend_settings.test.cjs
